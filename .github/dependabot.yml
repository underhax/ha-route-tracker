version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
