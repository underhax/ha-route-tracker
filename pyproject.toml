[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git"]
addopts = [
    "--strict-markers",
    "--cov=custom_components.route_tracker",
    "--cov-report=term-missing",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
